name: Android APK Yig'ish (Build APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodni yuklab olish (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Java JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Paketlarni o'rnatish
        run: npm install

      - name: ⚙️ EAS CLI o'rnatish
        run: npm install -g eas-cli

      - name: 🏗️ Android Prebuild qilish
        run: npx expo prebuild --platform android --no-install

      - name: 🔨 APK Yig'ish (Gradle AssembleRelease)
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../gradle.log || {
            grep -iE "error|unable|cannot|resolve|syntax" ../gradle.log | grep -v "What went wrong" | head -12 | cut -c1-300 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: 📤 APK Faylini Yuklash (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SecurePass-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
